<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14281e" />
      <stop offset="100%" stop-color="#2A4D3E" />
    </linearGradient>
  </defs>

  <!-- Fondo Principal (SIN bordes redondeados) -->
  <rect width="1200" height="450" fill="url(#bgGrad2)"/>

  <!-- Formas abstractas de fondo -->
  <path d="M 0 0 L 450 0 L 280 450 L 0 450 Z" fill="#ffffff" opacity="0.03" />
  <circle cx="1150" cy="80" r="280" fill="#38BDF8" opacity="0.05" />

  <!-- Etiqueta / Badge -->
  <rect x="70" y="70" width="230" height="34" rx="17" fill="rgba(255,255,255,0.15)"/>
  <text x="185" y="92" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PORTAFOLIO DIGITAL</text>

  <!-- Título Principal -->
  <text x="70" y="165" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="40" font-weight="bold">Todo tu trabajo docente</text>
  <text x="70" y="215" fill="#A3E635" font-family="'Segoe UI', sans-serif" font-size="40" font-weight="bold">organizado en un solo lugar</text>

  <!-- Subtítulo -->
  <text x="70" y="270" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="18">Controlá asistencias, planificaciones y calificaciones sin vueltas.</text>

  <!-- Ilustración derecha (Checklist y Promedios) -->
  <g transform="translate(760, 75)">
    <rect width="360" height="290" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    
    <!-- Item 1 (Completado) -->
    <circle cx="40" cy="55" r="12" fill="#A3E635"/>
    <path d="M 34 55 L 38 59 L 46 49" stroke="#14281e" stroke-width="2.5" fill="none"/>
    <rect x="65" y="49" width="180" height="12" fill="#ffffff" opacity="0.9"/>

    <!-- Item 2 (Completado) -->
    <circle cx="40" cy="110" r="12" fill="#A3E635"/>
    <path d="M 34 110 L 38 114 L 46 104" stroke="#14281e" stroke-width="2.5" fill="none"/>
    <rect x="65" y="104" width="220" height="12" fill="#ffffff" opacity="0.9"/>

    <!-- Item 3 (En proceso) -->
    <circle cx="40" cy="165" r="12" fill="#38BDF8"/>
    <rect x="65" y="159" width="150" height="12" fill="#ffffff" opacity="0.6"/>

    <!-- Item 4 (Pendiente) -->
    <circle cx="40" cy="220" r="12" fill="rgba(255,255,255,0.2)"/>
    <rect x="65" y="214" width="190" height="12" fill="#ffffff" opacity="0.4"/>

    <!-- Tarjeta Flotante Destacada -->
    <g transform="translate(180, 150)">
      <rect width="160" height="110" fill="#1e372c" stroke="#A3E635" stroke-width="2"/>
      <text x="20" y="35" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Promedio Curso</text>
      <text x="20" y="78" fill="#A3E635" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="bold">9.5</text>
    </g>
  </g>
</svg>
