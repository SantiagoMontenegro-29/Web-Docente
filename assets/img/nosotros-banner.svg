<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradNosotros" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14281e" />
      <stop offset="100%" stop-color="#2A4D3E" />
    </linearGradient>
  </defs>

  <!-- Fondo Recto Principal -->
  <rect width="1200" height="450" fill="url(#bgGradNosotros)"/>

  <!-- Tramas abstractas de fondo -->
  <circle cx="1100" cy="225" r="260" fill="#ffffff" opacity="0.03" />
  <circle cx="100" cy="400" r="180" fill="#38BDF8" opacity="0.04" />
  <path d="M 800 0 L 1200 0 L 1200 450 Z" fill="#ffffff" opacity="0.02"/>

  <!-- Logo Instuticional Integrado (Izquierda) -->
  <g transform="translate(70, 160)">
    <circle cx="45" cy="45" r="45" fill="#ffffff" opacity="0.1"/>
    <!-- Ave / Libro estilizado -->
    <path d="M 22 48 C 35 25 55 25 68 38 C 55 42 42 50 22 48 Z" fill="#A3E635"/>
    <path d="M 22 48 C 42 52 55 60 68 50 C 52 65 35 65 22 48 Z" fill="#38BDF8"/>
  </g>

  <!-- Badge Superior -->
  <rect x="180" y="70" width="230" height="34" rx="17" fill="rgba(255,255,255,0.12)"/>
  <text x="295" y="92" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PLATAFORMA INSTITUCIONAL</text>

  <!-- Título Principal -->
  <text x="180" y="160" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="bold">Educamos hoy,</text>
  <text x="180" y="210" fill="#A3E635" font-family="'Segoe UI', sans-serif" font-size="38" font-weight="bold">transformamos el mañana.</text>

  <!-- Subtítulo -->
  <text x="180" y="260" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="17">Una plataforma pensada para docentes, construida para el futuro.</text>

  <!-- Chips / Pilares (Comunidad, Compromiso, Innovación, Crecimiento) -->
  <g transform="translate(180, 310)">
    <!-- Comunidad -->
    <rect x="0" y="0" width="115" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="57" y="21" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Comunidad</text>
    
    <!-- Compromiso -->
    <rect x="125" y="0" width="125" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="187" y="21" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Compromiso</text>

    <!-- Innovación -->
    <rect x="260" y="0" width="115" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="317" y="21" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Innovación</text>

    <!-- Crecimiento -->
    <rect x="385" y="0" width="120" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="445" y="21" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Crecimiento</text>
  </g>

  <!-- Ilustración Derecha: Comunidad y Conectividad Educativa -->
  <g transform="translate(780, 75)">
    <rect width="340" height="290" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="rgba(255,255,255,0.04)"/>
    
    <!-- Red de Nodos / Piezas Conectadas -->
    <line x1="90" y1="100" x2="250" y2="100" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,6"/>
    <line x1="90" y1="100" x2="170" y2="200" stroke="#A3E635" stroke-width="2" stroke-dasharray="6,6"/>
    <line x1="250" y1="100" x2="170" y2="200" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- Nodo 1 -->
    <circle cx="90" cy="100" r="32" fill="#1e372c" stroke="#A3E635" stroke-width="2"/>
    <path d="M 82 105 C 82 95 98 95 98 105 Z" fill="#A3E635"/>
    <circle cx="90" cy="92" r="5" fill="#A3E635"/>

    <!-- Nodo 2 -->
    <circle cx="250" cy="100" r="32" fill="#1e372c" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 242 105 C 242 95 258 95 258 105 Z" fill="#38BDF8"/>
    <circle cx="250" cy="92" r="5" fill="#38BDF8"/>

    <!-- Nodo Central / Resultado -->
    <circle cx="170" cy="200" r="38" fill="#2A4D3E" stroke="#ffffff" stroke-width="2"/>
    <path d="M 160 200 L 167 207 L 180 193" stroke="#A3E635" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Banner Inferior de Tarjeta -->
    <rect x="40" y="248" width="260" height="24" fill="rgba(255,255,255,0.1)"/>
    <text x="170" y="264" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Red Institucional Activa</text>
  </g>
</svg>
