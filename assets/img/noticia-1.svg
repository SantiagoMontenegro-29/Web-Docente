    <!-- Aros Ambientales Centrados -->
    <circle cx="0" cy="0" r="130" fill="#38BDF8" opacity="0.06"/>
    <circle cx="0" cy="0" r="90" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    
    <!-- Foco Vectorial Centrado (0,0) -->
    <path d="M 0 -50 C -25 -50 -40 -30 -40 -5 C -40 15 -25 25 -20 38 L 20 38 C 25 25 40 15 40 -5 C 40 -30 25 -50 0 -50 Z" fill="none" stroke="#A3E635" stroke-width="4" stroke-linecap="round"/>
    <path d="M -15 48 L 15 48 M -10 56 L 10 56" stroke="#A3E635" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 -25 L 0 0 L 12 0" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Destellos -->
    <line x1="0" y1="-65" x2="0" y2="-58" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-45" y1="-40" x2="-38" y2="-34" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="-40" x2="38" y2="-34" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
