<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" style="width: 100%; height: auto;">
  <defs>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cardBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#183326" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e1f17" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Contenedor Recto -->
  <rect width="320" height="220" fill="url(#cardBg2)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>

  <!-- Encabezado -->
  <g transform="translate(16, 16)">
    <rect width="28" height="28" rx="8" fill="rgba(56, 189, 248, 0.15)"/>
    <circle cx="14" cy="11" r="4" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <path d="M 8 20 c 0 -3 2.5 -5 6 -5 s 6 2 6 5" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <text x="36" y="18" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Alumnos por Curso</text>
  </g>

  <g stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4">
    <line x1="40" y1="75" x2="290" y2="75"/>
    <line x1="40" y1="115" x2="290" y2="115"/>
    <line x1="40" y1="155" x2="290" y2="155"/>
  </g>

  <!-- Barras con bordes curvos (rx=6) -->
  <rect x="58" y="70" width="32" height="85" rx="6" fill="url(#cyanGrad)"/>
  <rect x="118" y="80" width="32" height="75" rx="6" fill="url(#cyanGrad)"/>
  <rect x="178" y="90" width="32" height="65" rx="6" fill="url(#cyanGrad)"/>
  <rect x="238" y="98" width="32" height="57" rx="6" fill="url(#cyanGrad)"/>

  <text x="74" y="62" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">32</text>
  <text x="134" y="72" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">29</text>
  <text x="194" y="82" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">27</text>
  <text x="254" y="90" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">25</text>

  <text x="74" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Lengua</text>
  <text x="134" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Matemática</text>
  <text x="194" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Historia</text>
  <text x="254" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Inglés</text>
</svg>
