<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="100%" height="100%">
  <defs>
    <!-- ClipPath para mantener las formas de fondo dentro del marco recto -->
    <clipPath id="cardClip">
      <rect width="420" height="540" x="0" y="0"/>
    </clipPath>
  </defs>

  <!-- Tarjeta Contenedora Principal (Bordes 100% Rectos) -->
  <g clip-path="url(#cardClip)">
    <rect width="420" height="540" fill="#1b382b"/>

    <!-- Formas Onduladas de Fondo -->
    <path d="M -50 0 C 100 80, 200 -20, 470 60 L 470 -50 L -50 -50 Z" fill="#244938" opacity="0.6"/>
    <path d="M -20 200 C 150 120, 250 280, 450 180 L 450 600 L -20 600 Z" fill="#142c21" opacity="0.5"/>
    <path d="M 100 540 C 200 420, 320 480, 450 390 L 450 550 L 100 550 Z" fill="#244938" opacity="0.4"/>
  </g>

  <!-- Bloque Superior: Logo + Título -->
  <g transform="translate(210, 52)">
    <!-- Logo Páparo/Garza en Verde Neón -->
    <g transform="translate(0, 0) scale(0.75)">
      <path d="M -38 -20 L 2 -32 L -4 -25 L -35 -16 Z" fill="none" stroke="#A3E635" stroke-width="2.5" stroke-linejoin="miter"/>
      <path d="M -48 -10 L -4 -26 L -12 -12 L -24 9 L -13 4 L 0 0 Z" fill="none" stroke="#A3E635" stroke-width="2.5" stroke-linejoin="miter"/>
      <path d="M -3 -11 L 11 -34 L 17 -28 L 1 0" fill="none" stroke="#A3E635" stroke-width="2.5" stroke-linejoin="miter"/>
      <path d="M 5 -1 L 17 -31 L 22 -26 L 8 3" fill="none" stroke="#A3E635" stroke-width="2.5" stroke-linejoin="miter"/>
      <path d="M 8 3 C 13 -2 18 0 21 -4 C 25 -8 32 -8 46 -4 C 36 0 29 3 26 8 C 22 13 -3 30 -38 40 C -16 26 1 13 8 3 Z" fill="none" stroke="#A3E635" stroke-width="2.5" stroke-linejoin="miter"/>
    </g>

    <!-- Nombre de Marca -->
    <text x="0" y="52" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Tiza Digital</text>
    
    <!-- Subtítulo -->
    <text x="0" y="74" fill="#A7F3D0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" text-anchor="middle" opacity="0.9">Plataforma para facilitar la gestión académica docente</text>
  </g>

  <!-- Tarjeta Interior de Información (Bordes Curvos y Verde Semitransparente) -->
  <rect x="24" y="150" width="372" height="360" rx="16" fill="#142c21" fill-opacity="0.65" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Sección Beneficios -->
  <g transform="translate(44, 170)">
    
    <!-- Item 1: Centralización Total -->
    <g transform="translate(0, 0)">
      <rect width="332" height="96" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <!-- Icono Check Verde -->
      <rect x="12" y="16" width="36" height="36" rx="8" fill="rgba(163, 230, 53, 0.15)"/>
      <path d="M 24 34 L 28 38 L 36 28" stroke="#A3E635" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Textos -->
      <text x="58" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Centralización Total</text>
      <text x="58" y="50" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Planificación, asistencia, calificaciones</text>
      <text x="58" y="66" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">y alumnos en un solo lugar.</text>
      
      <!-- Badge Status -->
      <rect x="268" y="16" width="52" height="20" rx="6" fill="rgba(163, 230, 53, 0.2)"/>
      <text x="294" y="30" fill="#A3E635" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">100%</text>
    </g>

    <!-- Item 2: Ahorro de Tiempo -->
    <g transform="translate(0, 110)">
      <rect width="332" height="96" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <!-- Icono Reloj Azul -->
      <rect x="12" y="16" width="36" height="36" rx="8" fill="rgba(56, 189, 248, 0.15)"/>
      <circle cx="30" cy="34" r="7" stroke="#38BDF8" stroke-width="2" fill="none"/>
      <path d="M 30 30 L 30 34 L 33 34" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Textos -->
      <text x="58" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Ahorro de Tiempo</text>
      <text x="58" y="50" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Mantené toda la información organizada</text>
      <text x="58" y="66" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">de manera rápida y segura.</text>

      <!-- Badge Status -->
      <rect x="268" y="16" width="52" height="20" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="294" y="30" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Rápido</text>
    </g>

    <!-- Item 3: Mejor Seguimiento -->
    <g transform="translate(0, 220)">
      <rect width="332" height="96" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <!-- Icono Trending Verde -->
      <rect x="12" y="16" width="36" height="36" rx="8" fill="rgba(163, 230, 53, 0.15)"/>
      <path d="M 22 40 L 27 34 L 31 37 L 38 28" stroke="#A3E635" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 34 28 L 38 28 L 38 32" stroke="#A3E635" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Textos -->
      <text x="58" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Mejor Seguimiento</text>
      <text x="58" y="50" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Evaluá el progreso y aprendizaje de</text>
      <text x="58" y="66" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">cada estudiante día a día.</text>

      <!-- Badge Status -->
      <rect x="268" y="16" width="52" height="20" rx="6" fill="rgba(251, 146, 60, 0.2)"/>
      <text x="294" y="30" fill="#FB923C" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Activo</text>
    </g>

  </g>
</svg>
