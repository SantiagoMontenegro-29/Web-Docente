    <text x="14" y="32" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="600">Mate: 7.9</text>

    <rect x="0" y="48" width="8" height="8" rx="2" fill="#F43F5E"/>
    <text x="14" y="56" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="600">Historia: 8.5</text>

