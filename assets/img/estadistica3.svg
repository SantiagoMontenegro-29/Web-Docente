<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" style="width: 100%; height: auto;">
  <!-- Fondo recto -->
  <rect width="320" height="220" fill="#142c21" fill-opacity="0.9" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <g transform="translate(16, 16)">
    <rect width="28" height="28" rx="8" fill="rgba(251, 146, 60, 0.15)"/>
    <path d="M 8 20 L 14 8 L 20 20 Z" stroke="#FB923C" stroke-width="2" stroke-linejoin="round" fill="none"/>
    <text x="36" y="18" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Promedio de Notas</text>
  </g>

  <!-- Dona circular suave -->
  <g transform="translate(110, 125)">
    <path d="M 0 -50 A 50 50 0 0 1 50 0 L 30 0 A 30 30 0 0 0 0 -30 Z" fill="#38BDF8"/>
