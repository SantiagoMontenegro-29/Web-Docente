    <circle cx="0" cy="0" r="28" fill="#0e1f17"/>
    <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">8.1</text>
    <text x="0" y="15" fill="#94a3b8" font-family="sans-serif" font-size="7" text-anchor="middle">PROMEDIO</text>
