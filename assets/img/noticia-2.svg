    <circle cx="0" cy="0" r="90" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    
    <!-- Carpeta Digital Centrada -->
    <rect x="-80" y="-55" width="160" height="110" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <path d="M -60 -55 L -15 -55 L 5 -38 L 80 -38" stroke="#38BDF8" stroke-width="3" fill="none"/>
    
    <!-- Botón / Flecha Carga -->
