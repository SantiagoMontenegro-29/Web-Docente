<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" style="width: 100%; height: auto;">
  <defs>
    <linearGradient id="neonGreenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="cardBg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#183326" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e1f17" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Tarjeta Contenedora Principal (0 CURVAS) -->
  <rect width="320" height="220" fill="url(#cardBg1)" stroke="rgba(163, 230, 53, 0.2)" stroke-width="1.5"/>

  <!-- Encabezado -->
  <g transform="translate(16, 16)">
    <rect width="28" height="28" rx="8" fill="rgba(163, 230, 53, 0.15)"/>
    <path d="M 9 19 h 10 M 14 9 v 7" stroke="#A3E635" stroke-width="2" stroke-linecap="round"/>
    <text x="36" y="18" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Docentes por Curso</text>
  </g>

  <!-- Guías -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4">
    <line x1="40" y1="75" x2="290" y2="75"/>
    <line x1="40" y1="115" x2="290" y2="115"/>
    <line x1="40" y1="155" x2="290" y2="155"/>
  </g>

  <!-- Barras (CON CURVAS) -->
  <rect x="58" y="75" width="32" height="80" rx="6" fill="url(#neonGreenGrad)"/>
  <rect x="118" y="75" width="32" height="80" rx="6" fill="url(#neonGreenGrad)"/>
  <rect x="178" y="75" width="32" height="80" rx="6" fill="url(#neonGreenGrad)"/>
  <rect x="238" y="75" width="32" height="80" rx="6" fill="url(#neonGreenGrad)"/>

  <text x="74" y="67" fill="#A3E635" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2.0</text>
  <text x="134" y="67" fill="#A3E635" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2.0</text>
  <text x="194" y="67" fill="#A3E635" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2.0</text>
  <text x="254" y="67" fill="#A3E635" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2.0</text>

  <text x="74" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Lengua</text>
  <text x="134" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Matemática</text>
  <text x="194" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Historia</text>
  <text x="254" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Inglés</text>
</svg>
