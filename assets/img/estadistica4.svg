<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" style="width: 100%; height: auto;">
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A3E635" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A3E635" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Contenedor Recto -->
  <rect width="320" height="220" fill="#142c21" fill-opacity="0.9" stroke="rgba(163, 230, 53, 0.2)" stroke-width="1.5"/>

  <g transform="translate(16, 16)">
    <rect width="28" height="28" rx="8" fill="rgba(163, 230, 53, 0.15)"/>
    <path d="M 8 18 L 13 12 L 17 15 L 22 9" stroke="#A3E635" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="36" y="18" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Asistencia por Curso</text>
  </g>

  <g stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4">
    <line x1="40" y1="75" x2="290" y2="75"/>
    <line x1="40" y1="115" x2="290" y2="115"/>
    <line x1="40" y1="155" x2="290" y2="155"/>
  </g>

  <!-- Área Sombreada y Línea curva -->
  <polygon points="60,80 130,92 200,105 270,70 270,155 60,155" fill="url(#areaGrad)"/>
  <polyline points="60,80 130,92 200,105 270,70" stroke="#A3E635" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodos circulares -->
  <g fill="#142c21" stroke="#A3E635" stroke-width="2.5">
    <circle cx="60" cy="80" r="5"/>
    <circle cx="130" cy="92" r="5"/>
    <circle cx="200" cy="105" r="5"/>
    <circle cx="270" cy="70" r="5"/>
  </g>

  <text x="60" y="68" fill="#A3E635" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">96%</text>
  <text x="130" y="80" fill="#A3E635" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">92%</text>
  <text x="200" y="93" fill="#A3E635" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">88%</text>
  <text x="270" y="58" fill="#A3E635" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">98%</text>

  <text x="60" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Lengua</text>
  <text x="130" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Matemática</text>
  <text x="200" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Historia</text>
  <text x="270" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Inglés</text>
</svg>
